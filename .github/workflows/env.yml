name: env

on: push

env:
  tags: 3.1

jobs:
  envjob:
    env:
      APP_NAME: "dev"
    runs-on: ubuntu-latest

    steps:
      - name: print env
        run: echo "welcome to $APP_NAME version $tags"

  Newjob:
    env:
      APP_NAME: "prod"
    runs-on: ubuntu-latest

    steps:
      - name: print env
        run: echo "welcome to $APP_NAME version $tags"     